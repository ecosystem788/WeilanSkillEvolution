name: Scheduler Windows regressions

# Matching changes are protected only after the next push or pull request.
# Local, unpushed work is not covered; the observed push cadence can delay CI by days.
on:
  workflow_dispatch:
  push:
    paths:
      - proposals/bounded-scheduler-v0.1/impl/wake_codex.ps1
      - proposals/codex-run-log-encoding-v0.1/test_wake_codex_encoding.py
      - proposals/codex-run-log-encoding-v0.1/emit_json.py
      - .github/workflows/scheduler-windows-regressions.yml
  pull_request:
    paths:
      - proposals/bounded-scheduler-v0.1/impl/wake_codex.ps1
      - proposals/codex-run-log-encoding-v0.1/test_wake_codex_encoding.py
      - proposals/codex-run-log-encoding-v0.1/emit_json.py
      - .github/workflows/scheduler-windows-regressions.yml

jobs:
  codex-run-log-encoding:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install focused test dependency
        run: python -m pip install pytest
      # If headless-runner console semantics fail this known-answer test, record a
      # portability finding and mark the route BLOCKED. Do not weaken the forced
      # cp936 control arm or its assertions merely to make the job green.
      - name: Verify Codex wake log UTF-8 encoding
        run: python -m pytest proposals/codex-run-log-encoding-v0.1/test_wake_codex_encoding.py -q
