name: Scheduler Windows regressions

# Matching changes are protected only after the next push or pull request.
# Local, unpushed work is not covered; the observed push cadence can delay CI by days.
on:
  workflow_dispatch:
  push:
    paths:
      - proposals/bounded-scheduler-v0.1/impl/wake_codex.ps1
      - proposals/bounded-scheduler-v0.1/impl/wake_agent.ps1
      - proposals/bounded-scheduler-v0.1/impl/test_wake_sentinel.py
      - proposals/codex-run-log-encoding-v0.1/test_wake_codex_encoding.py
      - proposals/codex-run-log-encoding-v0.1/emit_json.py
      - .github/workflows/scheduler-windows-regressions.yml
  pull_request:
    paths:
      - proposals/bounded-scheduler-v0.1/impl/wake_codex.ps1
      - proposals/bounded-scheduler-v0.1/impl/wake_agent.ps1
      - proposals/bounded-scheduler-v0.1/impl/test_wake_sentinel.py
      - proposals/codex-run-log-encoding-v0.1/test_wake_codex_encoding.py
      - proposals/codex-run-log-encoding-v0.1/emit_json.py
      - .github/workflows/scheduler-windows-regressions.yml

jobs:
  codex-run-log-encoding:
    runs-on: windows-latest
    steps:
      # This repository tracks paths up to 244 chars. The Windows runner checks out
      # at D:\a\<repo>\<repo> (46 chars), so a plain checkout exceeds the 260-char
      # MAX_PATH limit and git exits 128 before any test runs (observed: run
      # 30235193932, "unable to create file ...: Filename too long").
      # --system, not --global: actions/checkout overrides HOME to a temp dir before
      # reading git config, so a --global setting written here would be ignored.
      # If this step or checkout still fails, that is a real finding about the
      # repository's path depth. Record it and open a separate proposal; do not
      # narrow the checkout or delete tracked calibration data to make the job green.
      - name: Allow long paths before checkout
        run: git config --system core.longpaths true
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install focused test dependency
        run: python -m pip install pytest
      # If headless-runner console semantics fail this known-answer test, record a
      # portability finding and mark the route BLOCKED. Do not weaken the forced
      # cp936 control arm or its assertions merely to make the job green.
      - name: Verify Codex wake log UTF-8 encoding
        run: python -m pytest proposals/codex-run-log-encoding-v0.1/test_wake_codex_encoding.py -q
      - name: Verify Claude wake log cmd-owned UTF-8 redirection
        run: python -m pytest proposals/bounded-scheduler-v0.1/impl/test_wake_sentinel.py::test_wake_agent_capture_is_utf8_on_any_console_codepage -q
